name: Orderbook depth

run-name: ${{ inputs.watchdog_target != '' && format('Orderbook depth watchdog {0}', inputs.watchdog_target) || 'Orderbook depth' }}

on:
  schedule:
    - cron: "0 1,9,17 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      post_to_slack:
        description: Post result to Slack
        required: true
        default: false
        type: boolean
      watchdog_target:
        description: Internal watchdog target; leave empty for manual runs
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: orderbook-depth
  cancel-in-progress: false

jobs:
  orderbook-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Check whether the target slot is already complete
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          WATCHDOG_TARGET: ${{ inputs.watchdog_target }}
        run: node scripts/check-orderbook-slot.mjs

      - name: Fetch and calculate without posting
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.post_to_slack }}
        run: npm run dry-run

      - name: Fetch, calculate, and post to Slack
        if: ${{ (github.event_name == 'schedule' || inputs.post_to_slack) && steps.slot.outputs.should_post == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL repository secret is not configured." >&2
            exit 1
          fi
          npm start
