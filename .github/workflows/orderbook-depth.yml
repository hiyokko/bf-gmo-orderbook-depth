name: Orderbook depth

on:
  schedule:
    - cron: "0 1,9,17 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      post_to_slack:
        description: Post result to Slack
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: orderbook-depth
  cancel-in-progress: false

jobs:
  orderbook-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Fetch and calculate without posting
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.post_to_slack }}
        run: npm run dry-run

      - name: Fetch, calculate, and post to Slack
        if: ${{ github.event_name == 'schedule' || inputs.post_to_slack }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL repository secret is not configured." >&2
            exit 1
          fi
          npm start
