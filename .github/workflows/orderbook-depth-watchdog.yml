name: Orderbook depth watchdog

on:
  schedule:
    # The primary runs can be delayed or omitted. Check at off-peak minutes and
    # recover the latest unfinished 01:00, 09:00, or 17:00 JST execution slot.
    - cron: "7,17,27,37,47,57 * * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check only; do not dispatch the orderbook workflow
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: orderbook-depth-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Check the latest scheduled slot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCHDOG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          WATCHDOG_MIN_LAG_MINUTES: "20"
          WATCHDOG_MAX_LAG_MINUTES: "360"
        run: npm run watchdog
