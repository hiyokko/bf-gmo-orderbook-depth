name: BPJ VCT price divergence

on:
  workflow_dispatch:
    inputs:
      post_to_slack:
        description: Post result to Slack
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: bpj-vct-price-divergence
  cancel-in-progress: false

jobs:
  bpj-vct-comparison:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Fetch and calculate without posting
        if: ${{ !inputs.post_to_slack }}
        run: npm run bpj-vct:dry-run

      - name: Fetch, calculate, and post to Slack
        if: ${{ inputs.post_to_slack }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL repository secret is not configured." >&2
            exit 1
          fi
          npm run bpj-vct
